services:
  api:
    build:
      context: .
      args:
        EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-sentence_transformers}
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      DEMO_MODE: auto
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-sentence_transformers}
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
