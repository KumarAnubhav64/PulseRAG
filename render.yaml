# Render blueprint - PulseRAG web service.
#
# How to deploy:
#   1. Push this repo to GitHub (render.yaml must be on the default branch).
#   2. Render dashboard -> New -> Blueprint -> connect the GitHub repo.
#   3. Render will prompt for the `sync: false` env var (GROQ_API_KEY) - paste
#      your key there (Render stores it as a secret, never in the repo).
#   4. Deploy. The free tier spins down after ~15 min idle (~1 min cold start).
#
# Notes:
#   - EMBEDDING_BACKEND=fastembed (ONNX, ~150-250MB) - REQUIRED to fit Render's
#     512MB free tier. Local dev keeps sentence_transformers (torch); only this
#     deployed service runs fastembed. The Dockerfile bakes BOTH models at build
#     time so no build arg is needed; the runtime env var selects the backend.
#   - Render free has no managed Redis - the app's in-memory cache fallback
#     handles production automatically (REDIS_URL optional).
#   - Port is auto-detected by Render from the Dockerfile EXPOSE (8000).
services:
  - type: web
    name: pulserag
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false # Set securely in the Render dashboard (never committed)
      - key: EMBEDDING_BACKEND
        value: fastembed
      - key: FASTEMBED_CACHE_PATH
        value: /app/.cache/fastembed
      - key: DEMO_MODE
        value: auto
