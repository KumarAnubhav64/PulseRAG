# Render blueprint - PulseRAG web service.
#
# How to deploy:
#   1. Push this repo to GitHub (render.yaml must be on the default branch).
#   2. Render dashboard -> New -> Blueprint -> connect the GitHub repo.
#   3. Render will prompt for the `sync: false` env var (GROQ_API_KEY) - paste
#      your key there (Render stores it as a secret, never in the repo).
#   4. Deploy. The free tier spins down after ~15 min idle (~1 min cold start).
#
# Notes:
#   - EMBEDDING_BACKEND=remote (Mistral API) - zero local model RAM, REQUIRED
#     to fit Render's 512MB free tier. Local dev keeps sentence_transformers
#     (torch); only this deployed service runs remote embeddings. Set the
#     MISTRAL_API_KEY secret in the Render dashboard.
#   - The image still bakes the local models at build time, so you can flip
#     EMBEDDING_BACKEND back to fastembed at any time with no rebuild.
#   - Render free has no managed Redis - the app's in-memory cache fallback
#     handles production automatically (REDIS_URL optional).
#   - Port is auto-detected by Render from the Dockerfile EXPOSE (8000).
services:
  - type: web
    name: pulserag
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false # Set securely in the Render dashboard (never committed)
      - key: EMBEDDING_BACKEND
        value: remote
      - key: MISTRAL_API_KEY
        sync: false # Set securely in the Render dashboard (never committed)
      - key: REMOTE_EMBEDDING_MODEL
        value: mistral-embed
      - key: DEMO_MODE
        value: auto
      # Load the embedding model at startup so the first upload doesn't spike
      # memory mid-request and OOM the 512MB free instance.
      - key: PRELOAD_EMBEDDINGS
        value: true
      # Cap onnxruntime to one thread: Render free reports the host's cores,
      # and a per-core thread pool alone can push RAM past 512MB.
      - key: OMP_NUM_THREADS
        value: "1"
